name: Build arm64 Debian package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-linker and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aarch64-linux-gnu-gcc dpkg-dev

      - name: Build release binary for aarch64
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Assemble Debian package directory
        run: |
          set -e
          VERSION="0.1.0"
          PKG_DIR="overlayd_${VERSION}_arm64"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/lib/systemd/system"
          mkdir -p "$PKG_DIR/etc/overlayd"

          # Cross-compiled binary
          cp target/aarch64-unknown-linux-gnu/release/overlayd "$PKG_DIR/usr/bin/overlayd"
          chmod 755 "$PKG_DIR/usr/bin/overlayd"

          # Systemd user template service (started per user after Wayland session)
          cp packaging/overlayd@.service "$PKG_DIR/lib/systemd/system/overlayd@.service"
          chmod 644 "$PKG_DIR/lib/systemd/system/overlayd@.service"

          # Example config file
          cp packaging/config.toml.example "$PKG_DIR/etc/overlayd/config.toml"
          chmod 644 "$PKG_DIR/etc/overlayd/config.toml"

          # DEBIAN/control
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
Package: overlayd
Version: ${VERSION}
Section: x11
Priority: optional
Architecture: arm64
Maintainer: overlayd <overlayd@localhost>
Depends: libc6, libgcc-s1
Description: Lightweight Wayland overlay daemon
 overlayd is a lightweight single-thread Wayland overlay daemon
 using Slint software rendering into wl_shm and wlr-layer-shell.
 Designed for labwc and other wlroots-style compositors on ARM64
 (Raspberry Pi OS). Starts after a Wayland compositor is available.
EOF

          # DEBIAN/postinst — reload systemd so the new unit is picked up
          cat > "$PKG_DIR/DEBIAN/postinst" <<'EOF'
#!/bin/sh
set -e
if [ "$1" = "configure" ]; then
    systemctl daemon-reload || true
fi
EOF
          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"

      - name: Build .deb package
        run: |
          dpkg-deb --build --root-owner-group "$PKG_DIR"
          ls -la "$PKG_DIR.deb"

      - name: Upload .deb artifact (uncompressed)
        uses: actions/upload-artifact@v4
        with:
          name: overlayd-arm64-deb
          path: ${{ env.PKG_DIR }}.deb
          retention-days: 30
