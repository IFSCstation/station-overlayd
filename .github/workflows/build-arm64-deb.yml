
name: Build arm64 Debian package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev

      - name: Lint and test
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build

      - name: Inspect package
        run: |
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb

      - name: Upload .deb (direct, not zipped)
        uses: actions/upload-artifact@v7.0.2
        with:
          path: target/debian/*.deb
          archive: false
          if-no-files-found: error
          retention-days: 30
