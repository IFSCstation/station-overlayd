name: Build arm64 Debian package

on:
  push:
    branches: [ main ]
  tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev dpkg-dev

      - name: Lint and test
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Build .deb
        run: |
          VERSION="0.1.0"
          PKG_DIR="overlayd_${VERSION}_arm64"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/lib/systemd/user"
          mkdir -p "$PKG_DIR/etc/overlayd"

          # Cross-compiled binary
          cp target/aarch64-unknown-linux-gnu/release/overlayd "$PKG_DIR/usr/bin/overlayd"
          chmod 755 "$PKG_DIR/usr/bin/overlayd"

          # Systemd user template service
          cp packaging/overlayd@.service "$PKG_DIR/usr/lib/systemd/user/overlayd@.service"
          chmod 644 "$PKG_DIR/usr/lib/systemd/user/overlayd@.service"

          # Example config file
          cp packaging/config.toml.example "$PKG_DIR/etc/overlayd/config.toml"
          chmod 644 "$PKG_DIR/etc/overlayd/config.toml"

          # DEBIAN/control
          printf '%s\n' \
            'Package: overlayd' \
            "Version: ${VERSION}" \
            'Section: x11' \
            'Priority: optional' \
            'Architecture: arm64' \
            'Maintainer: overlayd <overlayd@localhost>' \
            'Depends: libc6, libgcc-s1' \
            'Description: Lightweight Wayland overlay daemon' \
            ' overlayd is a lightweight single-thread Wayland overlay daemon' \
            ' using Slint software rendering into wl_shm and wlr-layer-shell.' \
            ' Designed for labwc and other wlroots-style compositors on ARM64' \
            ' (Raspberry Pi OS). Starts after a Wayland compositor is available.' \
            > "$PKG_DIR/DEBIAN/control"

          # DEBIAN/postinst — reload systemd and give user instructions
          printf '%s\n' '#!/bin/sh' 'set -e' \
            'echo "=== overlayd installed ==="' \
            'echo "To start overlayd as a user service:"' \
            'echo "  systemctl --user daemon-reload"' \
            'echo "  systemctl --user enable overlayd@\$USER.service"' \
            'echo "  systemctl --user start overlayd@\$USER.service"' \
            'echo ""' \
            'echo "Config file installed at /etc/overlayd/config.toml"' \
            'echo "Copy it to ~/.config/overlayd/config.toml and edit as needed."' \
            'echo "=========================="' \
            > "$PKG_DIR/DEBIAN/postinst"
          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          # Build the .deb
          dpkg-deb --build --root-owner-group "$PKG_DIR"
          mv "$PKG_DIR.deb" target/overlayd_${VERSION}_arm64.deb
          ls -la target/overlayd_${VERSION}_arm64.deb

      - name: Inspect package
        run: |
          dpkg-deb --info target/overlayd_0.1.0_arm64.deb
          dpkg-deb --contents target/overlayd_0.1.0_arm64.deb

      - name: Upload .deb (direct, not zipped)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: overlayd-arm64-deb
          path: target/overlayd_0.1.0_arm64.deb
          archive: false
          if-no-files-found: error
          retention-days: 30
